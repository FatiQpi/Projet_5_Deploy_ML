name: CD - Deploy to HuggingFace

# S'active UNIQUEMENT quand on fusionne sur main
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: "Fatih09"
          SPACE_NAME: "technova-api" # Ton nouveau Space
        run: |
          echo "🚀 Démarrage du déploiement..."
          rm -rf .git
          git init -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git lfs install
          git lfs track "data/*.joblib"
          git add .
          git commit -m "Deploy: Release via GitHub Actions"
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          git push --force hf main